name: GPM Zarr diagnostic
on:
  push:
    branches: [lupus-cortex-2025-dataset]
    paths:
      - scripts/gpm_diag.py
      - .github/workflows/gpm-diag.yml
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install xarray zarr adlfs fsspec cftime
      - run: python scripts/gpm_diag.py
