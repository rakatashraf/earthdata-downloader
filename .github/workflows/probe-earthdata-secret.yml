name: Probe Earthdata Credentials

on:
  workflow_dispatch:
  push:
    branches: [lupus-cortex-2025-dataset-build]
    paths: [.github/workflows/probe-earthdata-secret.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check configured Earthdata credentials
        env:
          E1: ${{ secrets.EARTHDATA_TOKEN }}
          E2: ${{ secrets.NASA_EARTHDATA_TOKEN }}
          EU: ${{ secrets.EARTHDATA_USERNAME }}
          EP: ${{ secrets.EARTHDATA_PASSWORD }}
        run: |
          [ -n "$E1" ] && echo "EARTHDATA_TOKEN_SET=true" || echo "EARTHDATA_TOKEN_SET=false"
          [ -n "$E2" ] && echo "NASA_EARTHDATA_TOKEN_SET=true" || echo "NASA_EARTHDATA_TOKEN_SET=false"
          if [ -n "$EU" ] && [ -n "$EP" ]; then echo "EARTHDATA_USERPASS_SET=true"; else echo "EARTHDATA_USERPASS_SET=false"; fi
