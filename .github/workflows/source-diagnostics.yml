name: Dataset source diagnostics
on:
  push:
    branches: [lupus-cortex-2025-dataset]
    paths:
      - 'scripts/source_diagnostics.py'
      - '.github/workflows/source-diagnostics.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python scripts/source_diagnostics.py
